<section class="hero site-shell" aria-labelledby="intro-title">
  <div class="hero-copy">
    <p class="eyebrow">{{ site.data.bio.basics.label }} <span aria-hidden="true">/</span> Honolulu, Hawaii</p>
    <h1 id="intro-title">{{ site.data.bio.basics.name }}<span class="wordmark-dot" aria-hidden="true">.</span></h1>
    <p class="hero-summary">{{ site.data.bio.basics.summary }}</p>
    <div class="hero-actions"><a class="button button-primary" href="#projects">Explore my work <span aria-hidden="true">&#8600;</span></a><a class="button button-secondary" href="{{ '/resume.html' | relative_url }}">View resume <span aria-hidden="true">&#8599;</span></a></div>
    <div class="social-links"><a href="mailto:{{ site.data.bio.basics.email }}">Email</a>{% for profile in site.data.bio.basics.profiles %}<a href="{{ profile.url }}">{{ profile.network }} <span aria-hidden="true">&#8599;</span></a>{% endfor %}</div>
  </div>
  <figure class="portrait"><img src="{{ site.data.bio.basics.picture | relative_url }}" alt="Jake Dickinson" width="420" height="480" fetchpriority="high"><figcaption>Building for the web, from interface to backend.</figcaption></figure>
</section>
