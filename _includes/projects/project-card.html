<article class="project-card">
  <a class="project-image" href="{{ include.project.url | relative_url }}" tabindex="-1" aria-hidden="true"><img src="{{ include.project.image | relative_url }}" alt="" loading="lazy" width="640" height="360"></a>
  <div class="project-body">
    <div class="card-meta"><span>Project</span><span>{{ include.project.date }}</span></div>
    <h3><a href="{{ include.project.url | relative_url }}">{{ include.project.title }}</a></h3>
    <p>{{ include.project.summary }}</p>
    <ul class="tags" aria-label="Technologies">{% for label in include.project.labels %}<li>{{ label }}</li>{% endfor %}</ul>
    <a class="text-link" href="{% if include.project.projecturl %}{{ include.project.projecturl }}{% else %}{{ include.project.url | relative_url }}{% endif %}">{% if include.project.projecturl %}Visit project{% else %}View project{% endif %}<span class="visually-hidden">: {{ include.project.title }}</span> <span aria-hidden="true">↗</span></a>
  </div>
</article>
