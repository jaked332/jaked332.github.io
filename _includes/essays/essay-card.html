<article class="essay-card">
  <time class="card-meta" datetime="{{ include.essay.date | date: '%Y-%m-%d' }}">{{ include.essay.date | date: "%B %-d, %Y" }}</time>
  <h3><a href="{% if include.essay.essayurl %}{{ include.essay.essayurl }}{% else %}{{ include.essay.url | relative_url }}{% endif %}">{{ include.essay.title }}</a></h3>
  <p>{{ include.essay.content | markdownify | strip_html | normalize_whitespace | truncatewords: 28 }}</p>
  <ul class="tags" aria-label="Topics">{% for label in include.essay.labels %}<li>{{ label }}</li>{% endfor %}</ul>
  <a class="text-link" href="{% if include.essay.essayurl %}{{ include.essay.essayurl }}{% else %}{{ include.essay.url | relative_url }}{% endif %}">Read essay<span class="visually-hidden">: {{ include.essay.title }}</span> <span aria-hidden="true">↗</span></a>
</article>
