---
layout: home
---
<article class="article-shell">
  <header class="article-header">
    <a class="back-link" href="{{ '/essays/' | relative_url }}">← All essays</a>
    <h1>{{ page.title }}</h1>
    <time class="article-date" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </header>
  <div class="prose">{{ content }}</div>
  <div class="article-end"><a href="{{ '/essays/' | relative_url }}">Browse more essays <span aria-hidden="true">↗</span></a></div>
</article>
