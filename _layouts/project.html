---
layout: home
---
<article class="article-shell">
  <header class="article-header">
    <a class="back-link" href="{{ '/projects/' | relative_url }}">← All projects</a>
    <h1>{{ page.title }}</h1>
    <div class="article-date">{{ page.date }}</div>
    <ul class="tags" aria-label="Technologies">{% for label in page.labels %}<li>{{ label }}</li>{% endfor %}</ul>
  </header>
  <div class="prose">{{ content }}</div>
  <div class="article-end"><a href="{{ '/projects/' | relative_url }}">Browse more projects <span aria-hidden="true">↗</span></a></div>
</article>
